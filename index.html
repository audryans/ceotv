<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KPL TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxuc3suKfedfLcBIHNkfNQ9kUlZr2y1FQ",
  authDomain: "twitch-user-access.firebaseapp.com",
  projectId: "twitch-user-access",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// -------- BACK BUTTON FUNCTION --------
function goBackToMenu(){
  document.getElementById('twitchContainer').style.display = 'none';
  document.getElementById('iptvContainer').style.display = 'none';
  document.getElementById('streamMenu').style.display = 'block';

  // Reset Twitch
  const twitchFrame = document.querySelector('#twitchContainer iframe');
  if(twitchFrame) twitchFrame.src = twitchFrame.src;

  // Stop IPTV
  if(window.hlsInstance){
    window.hlsInstance.destroy();
    window.hlsInstance = null;
  }
}

// -------- REGISTER --------
async function registerUser(){
  const name = document.getElementById('fullName').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const pass = document.getElementById('password').value.trim();
  const confirm = document.getElementById('confirmPassword').value.trim();
  if(!name||!phone||!pass||!confirm) return alert("Fill all fields");
  if(pass!==confirm) return alert("Passwords do not match");

  await setDoc(doc(db,"viewers",phone),{
    full_name:name,password:pass,is_logged_in:false,is_approved:false,created_at:serverTimestamp()
  });

  alert("Registered. Contact admin.");
}

// -------- LOGIN --------
async function loginUser(){
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPassword').value.trim();

  const snap = await getDoc(doc(db,"viewers",phone));
  if(!snap.exists()) return alert("No account");

  const user = snap.data();
  if(user.password!==pass) return alert("Wrong password");
  if(!user.is_approved) return alert("Not approved");

  localStorage.setItem("activeUser",phone);
  showStreamMenu();
}

// -------- STREAM MENU --------
function showStreamMenu(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('streamWrap').style.display='flex';
  document.getElementById('streamMenu').style.display='block';
}

// -------- SELECT STREAM --------
function selectStream(type){
  document.getElementById('streamMenu').style.display='none';

  if(type==='twitch'){
    document.getElementById('twitchContainer').style.display='flex';
  }else{
    document.getElementById('iptvContainer').style.display='flex';
  }
}

// -------- LOGOUT --------
function logoutUser(){
  localStorage.removeItem("activeUser");
  location.reload();
}

window.selectStream = selectStream;
window.registerUser = registerUser;
window.loginUser = loginUser;
window.logoutUser = logoutUser;
window.goBackToMenu = goBackToMenu;

window.onload = ()=>{
  document.getElementById('registerBtn').onclick=registerUser;
  document.getElementById('loginBtn').onclick=loginUser;
  document.getElementById('logoutBtn').onclick=logoutUser;
};
</script>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff;}
#lockScreen{height:100vh;display:flex;justify-content:center;align-items:center;}
.card{width:340px;padding:25px;border-radius:16px;background:#111;text-align:center;}
input{width:100%;padding:10px;margin-top:10px;}
button{width:100%;padding:10px;margin-top:10px;background:#00ffe7;border:none;cursor:pointer;}
.switch{margin-top:10px;cursor:pointer;color:#00ffe7;}

#streamWrap{display:none;height:100vh;flex-direction:column;}
#streamMenu{text-align:center;padding:20px;}

#twitchContainer,#iptvContainer{
  display:none;
  flex:1;
  flex-direction:column;
  height:100%;
}

iframe{flex:1;width:100%;height:100%;border:none;}

.back-btn{
  background:#00ffe7;
  color:#000;
  padding:10px;
  border:none;
  cursor:pointer;
}

.logout-btn{
  position:fixed;
  top:10px;
  right:10px;
  background:red;
  color:white;
  border:none;
  padding:8px;
}
</style>
</head>

<body>

<div id="lockScreen">
  <div class="card" id="registerCard">
    <h2>Register</h2>
    <input id="fullName" placeholder="Full Name">
    <input id="phoneInput" placeholder="Phone">
    <input id="password" type="password" placeholder="Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">
    <button id="registerBtn">Register</button>
    <div class="switch" onclick="registerCard.style.display='none';loginCard.style.display='block'">Login</div>
  </div>

  <div class="card" id="loginCard" style="display:none;">
    <h2>Login</h2>
    <input id="loginPhone" placeholder="Phone">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div class="switch" onclick="loginCard.style.display='none';registerCard.style.display='block'">Back</div>
  </div>
</div>

<div id="streamWrap">
  <button id="logoutBtn" class="logout-btn">Logout</button>

  <div id="streamMenu">
    <h2>Select Stream</h2>
    <button onclick="selectStream('twitch')">My Twitch Stream</button>
    <button onclick="selectStream('iptv')">IPTV / YouTube</button>
  </div>

  <!-- TWITCH -->
  <div id="twitchContainer">
    <button class="back-btn" onclick="goBackToMenu()">⬅ Back</button>
    <iframe src="https://player.twitch.tv/?channel=kpltv1&parent=audryans.github.io"></iframe>
  </div>

  <!-- IPTV / YOUTUBE -->
  <div id="iptvContainer">
    <button class="back-btn" onclick="goBackToMenu()">⬅ Back</button>
    <iframe src="https://www.youtube.com/embed/0My7wjnDntI?autoplay=1&mute=1"></iframe>
  </div>

</div>

</body>
</html>
